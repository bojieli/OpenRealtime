  seed_base: 1729
development_treatments:
  policy_history:
    baseline: eight most recent execution records
    omitted: omit decision records; retain causal observations and heard/partial/pending/plan state
    selector: live-only omit-policy-history flag; recorded per invocation and action
    status: development-only; omission has not established paired audible success
  speech_control_reference_guard:
    version: 1
    behavior: reject spoken tokens matching known active or pending-plan IDs before execution
    rejection_status: control-reference-in-speech
    limitation: does not detect arbitrary control-language leakage
    previous_runs: immutable pre-guard recordings retain observed failures
  playback_state:
    version: 2
    behavior: expose requested speech as pending before TTS opens; never mark it heard at startup
    validation: startup-v2-st03-live-20260922-01; 85 audited requests; paired adaptation failed
  native_input_delivery:
    cell_id: DC-native-diagnostic
    grammar: released DuplexCascade checkpoint grammar
    tick_ms: 500
    default_words_per_tick: 2
    diagnostic_words_per_tick: [1, 2]
    selector: native_live.py --words-per-tick; manifest and terminal branch records
    admission: delay-only; accumulate due chunks after inference overruns
    trace_schema_version: 3
    status: one-word live completed; response onset after feedback only; no mid-speech adaptation
    limits:
      - Native grammar and backbone differ from A1-A3.
      - Chunk size changes delivery delay; it is an explicit treatment.
      - Offline response onset after correction does not establish mid-speech adaptation.
      - Original scoring windows stay fixed despite delayed word admission.
  feedback_gap:
    fixture: recorded-st02-gap10-20260922-01
    source: recorded-st02-20260922-01
    extra_pre_feedback_silence_seconds: 10
    branch_source_and_availability_shift_seconds: 10
    spoken_pcm: unchanged; byte-verified
    response_window_duration: unchanged
    purpose: allow prefix admission and initial response before feedback
    status: Qwen A2 v3-affordance run verified assistant playback spanning feedback onset; native run pending
  pending_affordance:
    selector: live-only --pending-affordance; recorded per invocation and action; audited as the request's final line
    default: v1
    versions:
      v1: "When a segment is pending, wait or revise it; new speech cannot be queued behind it." (every request)
      v2: "When a segment is pending, wait to let it play; revise only to change its words. New speech cannot be queued behind it." (every request)
      v3: v2 line while a segment is pending; otherwise "Nothing is pending: speak or continue to start new speech now, or wait to stay silent."
      v4: v2 line while a segment is pending; otherwise the v1 line (only the pending-state wording differs from v1)
    v3_finding: over 24 pairs the v3 idle line caused verbatim repetition of the last completed sentence (96/292 played transitions); repeat-probe-20260923-01
    evidence: revise-loop-probe-20260923-01 and qwen-st02-gap10-*-live-20260923-01
    status: development treatment on pilot pair st-02 only; prompt change, not a scorer or post-decision guard
