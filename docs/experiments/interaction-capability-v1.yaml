  freeze_status: not-frozen
  pilot_pairs: 24
  pilot_repeats_planned: 3
  held_out_pairs_planned: 80
  held_out_repeats_planned: 3
  held_out_status: unavailable-until-pilot-and-scoring-freeze
  provenance: repository-authored synthetic text; no human participants
  validation_limits:
    - Word times are authored estimates, not aligned recordings.
    - Prosodic cues are annotated diagnostics, not independently rated recordings.
    - Cues describe authored acoustic properties; recordings and independent label agreement remain unvalidated.
    - Addressing words and times are matched; directional annotations are synthetic metadata.
    - co-02 requires Spanish output, outside the validated English/French TTS language support.
    - Concurrent tasks need incremental timing/order scoring beyond lexical screens.
    - Output-revision timing must be validated against actual playback.
    - Lexical expectations are draft screens, not validated semantic scores.
