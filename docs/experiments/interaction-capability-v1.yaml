  id: Qwen/Qwen3-8B
  served_id: qwen3-8b
  revision: b968826d9c46dd6066d109eabc6255188de91218
  policy: prompted-joint-action-content
  trained_microturn_model: false
  thinking: false
  temperature: 0
  max_tokens: 128
