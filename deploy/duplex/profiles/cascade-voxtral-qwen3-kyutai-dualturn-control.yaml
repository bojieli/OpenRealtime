# Cell I0 (control, dualturn): the cascade of cascade-voxtral-qwen3-kyutai.yaml with
# DualTurn deciding every pause (tools/duplexmodels/turn_server.py on :9130).
# dual-channel turn/backchannel heads used as an endpoint score, with the assistant channel assumed silent.
# The gate closes after 200 ms of quiet and the predictor decides: at or above
# 0.473 the turn ends there, below it the floor holds, never past the 500 ms
# silence threshold plus the 1 s projection hold.
binding: cascade
asr-provider: vllm-realtime
asr-url: ws://127.0.0.1:9101/v1/realtime
asr-model: voxtral-realtime
fast-provider: vllm
fast-url: http://127.0.0.1:9100/v1
fast-model: qwen3-8b
slow-provider: openai-compatible
slow-url: http://127.0.0.1:9100/v1
slow-model: qwen3-8b
tts-provider: speech-socket
tts-url: ws://127.0.0.1:9125/v1/tts/stream
tts-model: kyutai/tts-1.6b-en_fr
turn-end-url: http://127.0.0.1:9130/v1/endpoint/dualturn
turn-end-mode: control
turn-end-threshold: 0.473
endpoint-silence: 200
projection-hold: 1s
turn-end-timeout: 500ms
# Threshold from the I0 calibration split at a 10% premature-endpoint budget:
# DualTurn needs 220-280 ms per call on an 8 s window, so its bound is 500 ms rather than the 300 ms default.
