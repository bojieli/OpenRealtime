# Fish S2 Pro synthesis substitution: sentence-level text admission, streamed
# PCM output at 44.1 kHz. Requires tts-fish.sh; public acceptance pending.
binding: cascade
asr-provider: streaming-asr
asr-url: http://127.0.0.1:9110
asr-model: nvidia/nemotron-speech-streaming-en-0.6b
fast-provider: vllm
fast-url: http://127.0.0.1:9100/v1
fast-model: qwen3-8b
slow-provider: openai-compatible
slow-url: http://127.0.0.1:9100/v1
slow-model: qwen3-8b
tts-provider: speech-socket
tts-url: ws://127.0.0.1:9124/v1/tts/stream
tts-model: fish-s2-pro
