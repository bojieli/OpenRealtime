# Cell I0 (control, livekit): the cascade of cascade-voxtral-qwen3-kyutai.yaml with
# LiveKit's transcript turn detector deciding every pause (tools/duplexmodels/turn_server.py on :9130).
# text only: it reads the words heard so far (sent in the request header) and nothing of the prosody.
# The gate closes after 200 ms of quiet and the predictor decides: at or above
# 0.5 the turn ends there, below it the floor holds, never past the 500 ms
# silence threshold plus the 1 s projection hold.
binding: cascade
asr-provider: vllm-realtime
asr-url: ws://127.0.0.1:9101/v1/realtime
asr-model: voxtral-realtime
fast-provider: vllm
fast-url: http://127.0.0.1:9100/v1
fast-model: qwen3-8b
slow-provider: openai-compatible
slow-url: http://127.0.0.1:9100/v1
slow-model: qwen3-8b
tts-provider: speech-socket
tts-url: ws://127.0.0.1:9125/v1/tts/stream
tts-model: kyutai/tts-1.6b-en_fr
turn-end-url: http://127.0.0.1:9130/v1/endpoint/livekit
turn-end-mode: control
turn-end-threshold: 0.5
endpoint-silence: 200
projection-hold: 1s
