<!doctype html>
<meta charset="utf-8">
<title>OpenRealtime</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; --line: color-mix(in oklab, currentColor 15%, transparent); }
  body {
    margin: 0; font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; height: 100dvh;
  }
  header, footer { padding: 1rem 1.25rem; border-color: var(--line); }
  header { border-bottom: 1px solid var(--line); display: flex; gap: 1rem; align-items: baseline; }
  footer { border-top: 1px solid var(--line); display: flex; gap: .75rem; align-items: center; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .state { font-size: .8125rem; opacity: .7; font-variant-numeric: tabular-nums; }
  main { overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: .75rem; }
  .turn { max-width: 60ch; padding: .625rem .875rem; border-radius: .75rem; border: 1px solid var(--line); }
  .turn.user { align-self: flex-end; background: color-mix(in oklab, currentColor 6%, transparent); }
  .turn.agent { align-self: flex-start; }
  .turn .who { font-size: .6875rem; text-transform: uppercase; letter-spacing: .06em; opacity: .55; }
  .turn.observed { align-self: stretch; border-style: dashed; opacity: .8; font-size: .875rem; }
  button {
    font: inherit; padding: .5rem 1rem; border-radius: .5rem; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: inherit;
  }
  button[disabled] { opacity: .45; cursor: default; }
  .level { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .level i { display: block; height: 100%; width: 0; background: currentColor; transition: width 80ms linear; }
</style>

<header>
  <h1>OpenRealtime</h1>
  <span class="state" id="state">not connected</span>
</header>
<main id="log"></main>
<footer>
  <button id="connect">Connect</button>
  <button id="hangup" disabled>Hang up</button>
  <span class="level"><i id="level"></i></span>
  <span class="state" id="stats"></span>
</footer>

<script type="module">
// A browser client that implements no media plumbing of its own.
//
// There is no jitter buffer here, no packet loss concealment, no resampling,
// and no echo cancellation: getUserMedia and RTCPeerConnection do all of it,
// which is the whole argument for shipping a WebRTC adapter rather than
// telling every client to reinvent this over a raw socket.
//
// Point it at the adapter's SDP endpoint. It is served from anywhere; the only
// thing it needs is that endpoint.
const ADAPTER = new URLSearchParams(location.search).get("adapter")
  ?? "http://127.0.0.1:8766/v1/realtime";

const state = document.getElementById("state");
const stats = document.getElementById("stats");
const log = document.getElementById("log");
const level = document.getElementById("level");
const connectButton = document.getElementById("connect");
const hangupButton = document.getElementById("hangup");

let connection = null;
let channel = null;
let microphone = null;
let turns = new Map();
let firstAudioAt = null;
let spokeAt = null;

function setState(text) { state.textContent = text; }

function turn(id, who, text, kind = who) {
  let element = turns.get(id);
  if (!element) {
    element = document.createElement("div");
    element.className = `turn ${kind}`;
    element.innerHTML = `<div class="who"></div><div class="text"></div>`;
    element.querySelector(".who").textContent = who;
    log.append(element);
    turns.set(id, element);
  }
  element.querySelector(".text").textContent = text;
  log.scrollTop = log.scrollHeight;
  return element;
}

function append(id, who, delta, kind = who) {
  const element = turns.get(id);
  const existing = element ? element.querySelector(".text").textContent : "";
  turn(id, who, existing + delta, kind);
}

async function connect() {
  connectButton.disabled = true;
  setState("asking for the microphone");
  microphone = await navigator.mediaDevices.getUserMedia({
    audio: {
      // The client's responsibility, and the browser's speciality. The server
      // does none of this and does not compensate for its absence.
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true,
    },
  });

  connection = new RTCPeerConnection();
  connection.addTrack(microphone.getAudioTracks()[0], microphone);

  const speaker = new Audio();
  speaker.autoplay = true;
  connection.ontrack = (event) => {
    speaker.srcObject = event.streams[0];
  };

  channel = connection.createDataChannel("oai-events");
  channel.onopen = () => {
    setState("connected");
    hangupButton.disabled = false;
    channel.send(JSON.stringify({
      type: "session.update",
      session: {
        type: "realtime",
        instructions: "You are a concise, friendly voice assistant.",
      },
    }));
  };
  channel.onmessage = (message) => handle(JSON.parse(message.data));

  connection.onconnectionstatechange = () => {
    setState(connection.connectionState);
    if (["failed", "closed", "disconnected"].includes(connection.connectionState)) {
      hangup();
    }
  };

  setState("negotiating");
  const offer = await connection.createOffer();
  await connection.setLocalDescription(offer);
  await new Promise((resolve) => {
    if (connection.iceGatheringState === "complete") return resolve();
    connection.onicegatheringstatechange = () => {
      if (connection.iceGatheringState === "complete") resolve();
    };
  });

  const response = await fetch(ADAPTER, {
    method: "POST",
    headers: { "Content-Type": "application/sdp" },
    body: connection.localDescription.sdp,
  });
  if (!response.ok) {
    setState(`adapter refused the offer: ${response.status}`);
    connectButton.disabled = false;
    return;
  }
  await connection.setRemoteDescription({ type: "answer", sdp: await response.text() });
  meter(microphone);
}

function handle(event) {
  switch (event.type) {
    case "input_audio_buffer.speech_started":
      spokeAt = performance.now();
      firstAudioAt = null;
      setState("listening");
      break;
    case "input_audio_buffer.speech_stopped":
      spokeAt = performance.now();
      setState("thinking");
      break;
    case "conversation.item.input_audio_transcription.completed":
      turn(event.item_id, "user", event.transcript);
      break;
    case "response.output_audio_transcript.delta":
      setState("speaking");
      append(event.item_id, "agent", event.delta);
      break;
    case "response.output_audio.delta":
      if (firstAudioAt === null && spokeAt !== null) {
        firstAudioAt = performance.now();
        stats.textContent = `first audio ${Math.round(firstAudioAt - spokeAt)} ms after the endpoint`;
      }
      break;
    case "openrealtime.observation.added":
      // Observed content is displayed differently on purpose. A person
      // looking at narrated screen text is looking at something the agent
      // read, not something anyone said.
      turn(event.observation_id, `observed · ${event.observer}`, event.text, "observed");
      break;
    case "response.function_call_arguments.done":
      turn(`call-${event.call_id}`, "tool call", `${event.name}(${event.arguments})`, "observed");
      // A real client executes the call here and returns its result. This one
      // has no tools, so it says so rather than leaving the call unanswered.
      channel.send(JSON.stringify({
        type: "conversation.item.create",
        item: {
          type: "function_call_output",
          call_id: event.call_id,
          output: JSON.stringify({ error: "this demo declares no tools" }),
        },
      }));
      break;
    case "response.done": {
      // A turn can end without having said anything, and the reason rides on
      // this event. Reading only that the turn is over would leave someone
      // watching a demo that connected, listened, answered nothing, and
      // reported itself healthy.
      const status = event.response?.status ?? "completed";
      const reason = event.response?.status_details?.reason ?? status;
      if (["incomplete", "failed"].includes(status)) {
        // The two worth interrupting for. Deliberately not "anything other
        // than completed": a cancelled turn is barge-in, the user
        // interrupting on purpose, and reporting that would be a demo crying
        // wolf every time someone speaks.
        setState(`${status}: ${reason}`);
      } else if (status === "completed" || status === "cancelled") {
        setState("connected");
      } else {
        // A status this demo predates. Which statuses deserve a warning is a
        // judgement about the ones we know; whether a status is shown at all
        // is not. Enumerating that too is how a client goes silent the day
        // the server learns a new word.
        setState(`connected · ${status}`);
      }
      break;
    }
    case "error":
      setState(`error: ${event.error?.message ?? "unknown"}`);
      break;
  }
}

function meter(stream) {
  const context = new AudioContext();
  const source = context.createMediaStreamSource(stream);
  const analyser = context.createAnalyser();
  analyser.fftSize = 512;
  source.connect(analyser);
  const samples = new Uint8Array(analyser.frequencyBinCount);
  (function tick() {
    if (!connection) return;
    analyser.getByteTimeDomainData(samples);
    let peak = 0;
    for (const sample of samples) peak = Math.max(peak, Math.abs(sample - 128));
    level.style.width = `${Math.min(100, (peak / 64) * 100)}%`;
    requestAnimationFrame(tick);
  })();
}

function hangup() {
  hangupButton.disabled = true;
  connectButton.disabled = false;
  channel?.close();
  connection?.close();
  microphone?.getTracks().forEach((track) => track.stop());
  connection = null;
  channel = null;
  microphone = null;
  level.style.width = "0";
  setState("not connected");
}

connectButton.onclick = () => connect().catch((failure) => {
  setState(`could not connect: ${failure.message}`);
  connectButton.disabled = false;
});
hangupButton.onclick = hangup;
</script>
