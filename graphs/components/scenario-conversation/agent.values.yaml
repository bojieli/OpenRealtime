apiVersion: openrealtime.ai/config/v1alpha1
graph: scenario_conversation
nodes:
  admission:
    threshold: 0.5
    prefix_padding_ms: 300
    silence_duration_ms: 500
    speech_duration_ms: 120
    cancellation_memory: 128
    terminal_memory: 128
    max_frame_bytes: 1048576
    max_sample_rate_hz: 384000
  endpoint_policy:
    mode: automatic
    cancellation_memory: 128
    terminal_memory: 128
  asr:
    provider: deployment.scenario-conversation.asr
    name: scenario-conversation-audio
    source: microphone
  audio_final_gate:
    admit_provisional: false
  content:
    observer: client
    text_source: text
    attachment_source: message
    retention_scope: session
    max_text_bytes: 1048576
    max_metadata_bytes: 65536
    max_input_bytes: 33554432
    max_pending: 32
    max_pending_bytes: 67108864
    max_streams: 256
    terminal_memory: 512
  retention:
    scope: session
    max_items: 32
    max_bytes: 67108864
    max_item_bytes: 33554432
    max_metadata_bytes: 65536
    max_active_leases: 256
    terminal_memory: 512
    cancel_memory: 256
  media_resolver:
    max_pending: 32
    max_bytes: 67108864
    max_metadata_bytes: 65536
    allowed_mime_types:
      - "*/*"
    terminal_memory: 512
  audio_observation_commit:
    revision_namespace: audio
  message_observation_commit:
    revision_namespace: message
  trajectory: {}
  semantic_admission:
    decider: deployment.scenario-conversation.semantic-policy
    direct_visual_input: false
    standing_extraction: false
    verify_voice_activation: false
    verify_silent_action: false
    minimum_activation_confidence: 0
    recent_lines: 12
    max_pending: 64
    terminal_memory: 512
    cancel_memory: 256
    standing_memory: 64
    transcript_events: null
  voice_session_invocation:
    role: foreground
    terminal_memory: 512
    cancel_memory: 256
  silent_session_invocation:
    role: silent
    terminal_memory: 512
    cancel_memory: 256
  post_commit_silence:
    delay_ms: 15000
  overlap_barge_in:
    decider: deployment.scenario-conversation.semantic-policy
    # Allow a short acknowledgement to reach ASR and semantic classification.
    # Directed speech still cancels immediately when classified.
    hold_ms: 1800
    unclassified: cancel
    max_active_runs: 256
    max_utterances: 512
  voice_model:
    provider: deployment.scenario-conversation.model
    retain_reasoning: false
    max_output_bytes: 4194304
    max_events: 65536
    max_tool_proposals: 1024
  silent_model:
    provider: deployment.scenario-conversation.model-silent
    retain_reasoning: false
    max_output_bytes: 4194304
    max_events: 65536
    max_tool_proposals: 1024
  control_quarantine:
    max_candidate_bytes: 4194304
    max_blocks: 1024
    max_active_streams: 32
  silent_control_quarantine:
    max_candidate_bytes: 4194304
    max_blocks: 1024
    max_active_streams: 32
  model_result_commit:
    retain_rejected_speech: true
  segment:
    minimum_runes: 1
    # Keep short sentences intact so each comma does not reset TTS prosody.
    # Short complete sentences still release immediately via minimum_runes.
    minimum_clause_runes: 80
    max_segment_bytes: 65536
    max_run_bytes: 1048576
    max_segments: 256
    terminal_memory: 256
  provenance_join: {}
  proposal_admission:
    allow_system: false
  tool_lookup:
    registry: deployment.scenario-conversation.tools
  normalize_arguments: {}
  confirmation:
    provider: deployment.scenario-conversation.confirmation
  target_fence:
    target: deployment.scenario-conversation.target
  canonical_call_commit: {}
  ledger_commit:
    ledger: deployment.scenario-conversation.ledger
  dispatch:
    registry: deployment.scenario-conversation.tools
    ledger: deployment.scenario-conversation.ledger
  tool_result_commit: {}
  tts:
    provider: deployment.scenario-conversation.tts
  playback:
    sink: deployment.scenario-conversation.playback
    frame_duration_ms: 100
    max_chunk_bytes: 4194304
    cancel_memory: 256
