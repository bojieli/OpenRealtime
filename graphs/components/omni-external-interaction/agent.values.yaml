apiVersion: openrealtime.ai/config/v1alpha1
graph: omni_external_interaction
nodes:
  foreground:
    deployment: deployment.omni
    settings: {}
    port_formats:
      audio:
        - payload_mode: json_binary
          max_json_bytes: 65536
          max_binary_bytes: 4800
          media:
            kind: audio
            encoding: audio/pcm
            sample_format: s16le
            sample_rate_hz: 24000
            channels: 1
            max_frame_duration_ms: 100
      video:
        - payload_mode: json_binary
          max_json_bytes: 65536
          max_binary_bytes: 8388608
          media:
            kind: video
            encoding: image/jpeg
            max_width: 1920
            max_height: 1080
            max_frame_rate_millihz: 30000
      audio_out:
        - payload_mode: json_binary
          max_json_bytes: 65536
          max_binary_bytes: 4800
          media:
            kind: audio
            encoding: audio/pcm
            sample_format: s16le
            sample_rate_hz: 24000
            channels: 1
            max_frame_duration_ms: 100
