name: ci

# The gate that runs on every change is the same script a contributor runs
# locally. A CI configuration that grows its own list of steps drifts from the
# local one, and then "it passes on my machine" becomes a true statement about
# a different set of checks.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos-client:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Linux runs a source-level capability contract; this job is the actual
      # Apple-framework compile for AVFoundation, ScreenCaptureKit, WebKit,
      # Accessibility, CoreGraphics, and the SwiftUI application together.
      - name: Build native developer client
        run: swift build --package-path macos -c debug

      - name: Build and verify native application bundle
        run: |
          ./macos/build-app.sh debug
          app="macos/.build/OpenRealtime Developer.app"
          test -x "$app/Contents/MacOS/OpenRealtimeMac"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"

      - name: Browser and assembled native app use one clean server
        run: ./macos/verify-hosted-companion.sh "macos/.build/OpenRealtime Developer.app"

      - name: Check browser-use adapter and app bundler
        run: |
          python3 -m py_compile macos/BrowserUseBridge/bridge.py
          bash -n macos/build-app.sh
          bash -n macos/prepare-browser-use.sh
          bash -n macos/verify-hosted-companion.sh

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Review media sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg bubblewrap libopus-dev libopusfile-dev pkg-config

      # The reference sidecars run in mock mode under the Go conformance
      # suite; they need only numpy and Pillow, which is what the sidecar
      # unit suite pins too.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reference sidecar runtime
        run: python -m pip install --quiet -r sidecars/requirements-test.txt

      - name: Verification gate
        env:
          OPENREALTIME_GO_BIN: ${{ github.workspace }}/go-bin/go
        run: |
          mkdir -p go-bin && ln -sf "$(command -v go)" go-bin/go
          ./scripts/check.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      # Release binaries are built on every change, not only on a tag: a build
      # that is only exercised at release time is a build that breaks at
      # release time, which is the worst moment to find out.
      - name: Cross-platform release build
        env:
          OPENREALTIME_GO_BIN: ${{ github.workspace }}/go-bin/go
        run: |
          mkdir -p go-bin && ln -sf "$(command -v go)" go-bin/go
          ./scripts/build-release.sh dist

      # Reproducibility is a property of the build, so it is checked like any
      # other property rather than asserted in the documentation.
      - name: Builds are reproducible
        env:
          OPENREALTIME_GO_BIN: ${{ github.workspace }}/go-bin/go
        run: |
          ./scripts/build-release.sh dist-again
          for binary in dist/openrealtime-*; do
            name="$(basename "$binary")"
            cmp "$binary" "dist-again/$name" \
              || { echo "$name is not reproducible" >&2; exit 1; }
          done
          echo "all binaries reproduced byte for byte"

      - uses: actions/upload-artifact@v7
        with:
          name: openrealtime-binaries
          path: |
            dist/openrealtime-*
            dist/SHA256SUMS-*.txt

  # The gate job above runs check.sh without OPENREALTIME_RELEASE_GATE, which is
  # correct for it: on a runner with no browser the official-client claim skips,
  # check_official_client says so, and an ordinary run is not failed for a
  # missing dependency.
  #
  # But that means the release flag - the mechanism whose whole purpose is to
  # refuse a claim that was not checked - was set nowhere in this repository.
  # A protection that never runs is not a protection, and the claim it guards is
  # the compatibility claim: an official OpenAI Realtime client completing a
  # tool-using session unmodified, over WebSocket and over WebRTC. That is
  # section 8's most externally visible promise and the easiest to ship broken,
  # because a skipped test and a passing test both print ok.
  #
  # So this job installs what the claim needs - the official SDK and a browser -
  # and runs the gate with the flag set, where a skip is a failure. If the SDK
  # publishes a breaking change, this job fails while the gate job stays green,
  # which is the distinction worth having in CI.
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Official Realtime SDK
        working-directory: examples/sdk-client
        run: npm install --no-audit --no-fund

      # Under the release gate a reference sidecar that cannot start is a
      # failure, so the mock-mode runtime is installed rather than tolerated.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reference sidecar runtime
        run: python -m pip install --quiet -r sidecars/requirements-test.txt

      - name: Browser for the WebRTC transport
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg bubblewrap libopus-dev libopusfile-dev pkg-config
          sudo apt-get install -y --no-install-recommends chromium-browser \
            || sudo apt-get install -y --no-install-recommends chromium
          # The test looks for chromium, chromium-browser, then google-chrome on
          # PATH, and honours CHROMIUM. Resolve it here so a rename in the runner
          # image fails this step rather than silently skipping the WebRTC half.
          for candidate in chromium chromium-browser google-chrome; do
            if path="$(command -v "$candidate")"; then
              echo "CHROMIUM=$path" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no chromium on PATH after install" >&2
          exit 1

      # A skip is a failure here. That is the entire point of the job.
      - name: Compatibility claim, required
        env:
          OPENREALTIME_GO_BIN: ${{ github.workspace }}/go-bin/go
          OPENREALTIME_RELEASE_GATE: '1'
        run: |
          mkdir -p go-bin && ln -sf "$(command -v go)" go-bin/go
          ./scripts/check.sh

  # The release matrix is the machine-readable claim inventory, and until now
  # nothing ran it: the gate above runs check.sh, which tolerates skips by
  # design, and the matrix's dedicated gates - efficiency, the Opus encoder,
  # sidecar conformance, the extension conformance suites, every fuzz target,
  # the browser presentation profiles, the portable clients - could rot with
  # every check green. This job runs the complete local scope with skips
  # forbidden and keeps the create-only report as an artifact. It provisions
  # exactly what the plan says the local gates need; a provisioned gate stays
  # blocked here, which the report records rather than hides.
  release-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Local gate prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg bubblewrap libopus-dev libopusfile-dev pkg-config
          sudo apt-get install -y --no-install-recommends chromium-browser \
            || sudo apt-get install -y --no-install-recommends chromium
          for candidate in chromium chromium-browser google-chrome; do
            if path="$(command -v "$candidate")"; then
              echo "CHROMIUM=$path" >> "$GITHUB_ENV"
              break
            fi
          done
          python -m pip install --quiet -r sidecars/requirements-test.txt
          # The Swift gate never pulls; the image must be present before it runs.
          docker pull --quiet swift:5.10-jammy

      - name: Official Realtime SDK
        working-directory: examples/sdk-client
        run: npm install --no-audit --no-fund

      - name: Local release matrix
        env:
          OPENREALTIME_GO_BIN: ${{ github.workspace }}/go-bin/go
        run: |
          mkdir -p go-bin && ln -sf "$(command -v go)" go-bin/go
          evidence=".runtime/release-validation/ci-${{ github.run_id }}-${{ github.run_attempt }}"
          ./scripts/release-validate.sh -mode run -scope local \
            -artifacts "$evidence" -report "$evidence/report.json"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-matrix-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/release-validation/ci-*/
          if-no-files-found: ignore

  sidecars:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The sidecar library is what a non-Go model implementation depends on,
      # so its wire framing is checked here even though nothing in the Go tree
      # imports it.
      #
      # This step used to end by forgiving pytest's exit code 5, which means "no
      # tests collected". That tolerated the one outcome most worth failing on:
      # the day sidecars/test_protocol.py is renamed, moved, or made unimportable,
      # collection returns nothing, the failure is forgiven, and CI reports a green
      # wire-framing check that ran no tests. Requiring the suite to actually run
      # costs nothing while it exists, and is the whole check once it does not.
      - name: Sidecar library
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r sidecars/requirements-test.txt
          python -m compileall -q sidecars
          python -m pytest sidecars -q

  # Known advisories against the code that actually reaches them.
  #
  # This job is not in scripts/check.sh for the same reason the benchmarks are
  # not: it needs the network. The vulnerability database is fetched at scan
  # time, so a gate that ran it offline would either fail for a reason
  # unrelated to the change or, worse, pass against a stale database and report
  # a clean scan it did not perform.
  #
  # It runs govulncheck rather than reading the module graph, because the
  # question is reachability. When this job was written the module was pinned
  # to a Go 1.25.0 toolchain and to golang.org/x/text and golang.org/x/net
  # releases that predated their fixes, and thirty-one advisories were reachable
  # from this code - in crypto/tls, crypto/x509, net/http, net/url,
  # encoding/asn1, os, and the two x modules. Every one of them had been fixed
  # upstream. Nothing in the repository was arranged to notice.
  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      # The standard library govulncheck reports is the one the build used, so
      # the toolchain this job resolves is part of the claim rather than
      # incidental to it.
      - name: Report the toolchain under test
        run: go version

      - name: Known advisories reachable from this code
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Known advisories in the LiveKit integration
        working-directory: integrations/livekit
        run: "$(go env GOPATH)/bin/govulncheck ./..."

  # The container is built on every change for the same reason the release
  # binaries are: a build that is only exercised at release time is a build
  # that breaks at release time. deploy/Dockerfile was the one artifact this
  # repository publishes that no job built, so it could have stopped working at
  # any point between releases with every other job green.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the server image
        run: docker build -f deploy/Dockerfile -t openrealtime:ci .

      # A distroless image has no shell, so this is also the check that the
      # entrypoint is the binary and not something that needed one. The version
      # output is what a binary found running somewhere reports about itself,
      # which is the claim deploy/README.md makes for it.
      - name: The image runs and reports what it was built from
        run: |
          printed="$(docker run --rm openrealtime:ci version)"
          echo "${printed}"
          case "${printed}" in
            "openrealtime "*) ;;
            *) echo "unexpected version output" >&2; exit 1 ;;
          esac
